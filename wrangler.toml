name = "happy-potato-loyalty"
compatibility_date = "2024-01-01"

[build]
command = "npm install && npm run build"
cwd = "loyalty-app"

[build.upload]
format = "service-worker"

[[build.upload.rules]]
type = "ESModule"
globs = ["**/*.js"]

[[build.upload.rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[env.production]
name = "happy-potato-loyalty"
route = ""
